name: Deploy Static Site


on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 16
          cache: 'npm'

      - name: Install Dependencies & Production Build
        run: |
          npm ci
          # サーバーを動かす前に、あらかじめ本番用のビルドを走らせて dist を作っておく場合はここで行います
          npm run build-prod

      - name: Start Web Server and Run 60s Loop
        run: |
          # 1. パッケージに含まれるウェブサーバー（開発サーバー等）をバックグラウンドで起動
          npm start &
          
          # サーバーが完全に立ち上がるまで少し待機（必要に応じて調整してください）
          sleep 3

          # 2. 60秒間のカウントアップループを実行してサーバーの稼働を維持
          i=0
          while [ $i -lt 60 ]; do
            sleep 1
            i=$((i + 1))
          done
          echo "60秒間のサーバー稼働ループが終了しました。"

      - name: Push dist to gh-pages
        run: |
          echo "60秒の外側で gh-pages へのプッシュ処理を開始します。"
          
          # distフォルダに移動してGitを初期化し、強制プッシュを実行
          echo "=== 変更をリポジトリにプッシュ中... ==="
          
          # GitHub Actions用の共通Botアカウントを設定
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          
          # 変更がある場合のみコミットしてプッシュ
          git add ./dist*
          if ! git diff-index --quiet HEAD --; then
            git commit -m "chore: update extensions-v0.json path to local reference"
            git push origin HEAD
            echo "変更を保存しました！"
          else
            echo "変更はありませんでした。"
          fi

      - name: Stop Web Server
        if: always()  # プッシュの成否に関わらず、必ずサーバープロセスを停止させる
        run: |
          echo "稼働中のウェブサーバー（nodeプロセス）を停止します。"
          # webpack serve や node などの関連プロセスを名前でまとめて終了
          pkill -f "node" || echo "対象のプロセスは見つかりませんでした。"
